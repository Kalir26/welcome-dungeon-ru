name: Publish Welcome to the Dungeon

on:
  push:
    branches: [main]
    paths:
      - game-release.zip
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify and unpack the unchanged game
        run: |
          echo '125bafe6282cbcc6a6d7415c62680ae7d60058b111f426829a791a69d346fd54  game-release.zip' | sha256sum --check --strict
          unzip -q game-release.zip -d public
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('public')
          assert (root / 'index.html').is_file()
          manifest = json.loads((root / 'precache.json').read_text())
          assert manifest['revision'] == 'd96e26b3697c6344a382'
          assert len(manifest['files']) == 874
          for item in manifest['files']:
              data = (root / item['path']).read_bytes()
              assert len(data) == item['bytes'], item['path']
              assert hashlib.sha256(data).hexdigest() == item['sha256'], item['path']
          print('Verified all 874 offline game assets')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload only game files
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
